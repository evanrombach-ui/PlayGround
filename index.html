<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GODSCOURGE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Manrope:wght@600;700;800&display=swap');
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090b12;color:#fff;touch-action:none;font-family:Manrope,sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none}.hud{height:100%;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-family:Cinzel;font-size:13px;letter-spacing:3px;text-shadow:0 2px 12px #000}.stage{margin-top:2px;font-size:10px;letter-spacing:2px;color:#c7a96b}.healthbox{width:195px}.bossname{text-align:right;font-family:Cinzel;font-size:12px;letter-spacing:2px;color:#e6d7af}.bar{height:9px;margin-top:6px;border:1px solid rgba(255,255,255,.16);background:rgba(8,8,13,.75);clip-path:polygon(2% 0,100% 0,98% 100%,0 100%)}.fill{height:100%;width:100%;background:linear-gradient(90deg,#a22535,#f46a58);box-shadow:0 0 12px #e44}.playerbar{position:absolute;left:14px;bottom:136px;width:150px}.playerbar .label{font-family:Cinzel;font-size:11px;letter-spacing:1px}.playerbar .bar{height:12px}.playerbar .fill{background:linear-gradient(90deg,#d8b85d,#fff1a6)}.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}.stick{position:relative;width:112px;height:112px;border-radius:50%;pointer-events:auto;border:1px solid rgba(231,210,168,.14);background:radial-gradient(circle,rgba(234,216,177,.08) 0 32%,rgba(12,15,23,.32) 33% 100%);box-shadow:inset 0 0 25px rgba(255,255,255,.04)}.knob{position:absolute;width:48px;height:48px;border-radius:50%;left:32px;top:32px;background:linear-gradient(145deg,rgba(232,220,190,.32),rgba(93,88,78,.25));border:1px solid rgba(255,244,210,.28);box-shadow:0 4px 15px rgba(0,0,0,.35)}.actions{display:flex;align-items:flex-end;gap:10px}.action{pointer-events:auto;border-radius:50%;border:1px solid rgba(255,243,211,.24);background:linear-gradient(145deg,rgba(216,190,130,.24),rgba(28,28,38,.45));box-shadow:0 8px 20px rgba(0,0,0,.28),inset 0 0 18px rgba(255,255,255,.06);display:grid;place-items:center;color:#e8dcc1;font-family:Cinzel;font-size:15px}.atk{width:76px;height:76px;font-size:24px}.dash{width:58px;height:58px;font-size:10px}.skill{width:64px;height:64px;font-size:11px}.cool{position:absolute;border-radius:50%;inset:0;background:rgba(5,6,10,.72);clip-path:polygon(50% 50%,50% 0%,50% 0%,50% 0%,50% 0%,50% 0%)}.toast{position:absolute;left:50%;top:19%;transform:translateX(-50%);font-family:Cinzel;font-size:20px;letter-spacing:6px;text-align:center;text-shadow:0 3px 18px #000;opacity:0}.toast.show{animation:fade 2s}.subtitle{font-size:8px;color:#c8b98f;letter-spacing:3px;margin-top:7px}@keyframes fade{0%,100%{opacity:0}15%,75%{opacity:1}}.menu{pointer-events:auto;position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(83,73,55,.38),rgba(5,7,12,.92));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.menu.hidden{display:none}.sigil{width:94px;height:94px;border:1px solid #9f926f;border-radius:50%;display:grid;place-items:center;margin-bottom:24px;box-shadow:0 0 35px rgba(211,178,107,.12),inset 0 0 25px rgba(211,178,107,.08);font-family:Cinzel;font-size:45px;color:#dabd78}.title{font-family:Cinzel;font-size:40px;letter-spacing:8px;line-height:.95;text-shadow:0 5px 20px #000}.title em{display:block;font-size:15px;font-style:normal;letter-spacing:13px;color:#a89a75;margin-top:13px}.start{margin-top:45px;width:190px;height:52px;border:1px solid #a79970;background:linear-gradient(90deg,rgba(106,91,55,.15),rgba(196,171,111,.24));color:#eee3c6;font-family:Cinzel;font-size:14px;letter-spacing:4px}.menu p{width:280px;font-size:11px;line-height:1.8;color:#b7b0a1;margin-top:18px}.levelup{position:absolute;inset:0;pointer-events:auto;background:rgba(5,7,12,.82);display:none;align-items:center;justify-content:center;flex-direction:column}.levelup.show{display:flex}.levelup h2{font-family:Cinzel;letter-spacing:5px}.cards{display:flex;gap:9px}.card{width:92px;height:130px;border:1px solid #766d56;background:linear-gradient(160deg,#242638,#11131d);border-radius:4px;padding:12px 8px;color:#ddd;font-size:10px}.card b{display:block;font-family:Cinzel;font-size:12px;color:#dbc37c;margin-bottom:12px}@media(max-width:700px) and (orientation:portrait){.healthbox{width:155px}.playerbar{bottom:130px;width:125px}.stick{width:104px;height:104px}.knob{left:28px;top:28px}.bottom{padding:0 2px}.actions{gap:7px}.atk{width:68px;height:68px}.skill{width:58px;height:58px}.dash{width:52px;height:52px}.title{font-size:34px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="ui"><div class="hud"><div class="top"><div><div class="brand">GODSCOURGE</div><div class="stage" id="stage">THE SUNKEN TEMPLE</div></div><div class="healthbox"><div class="bossname" id="bossname">THE HOLLOW SUN</div><div class="bar"><div class="fill" id="bossfill"></div></div></div></div><div class="playerbar"><div class="label">THE EXILED</div><div class="bar"><div class="fill" id="playerfill"></div></div></div><div class="bottom"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><div class="action dash" id="dash">DASH</div><div class="action skill" id="skill">WRATH</div><div class="action atk" id="atk">⚔</div></div></div></div><div class="toast" id="toast">THE HOLLOW SUN<div class="subtitle">A GOD WITHOUT MERCY</div></div><div class="menu" id="menu"><div class="sigil">✦</div><div class="title">GODS<em>SCOURGE</em></div><p>The gods fell silent. Rise as the last Exiled and carve your divinity from their ashes.</p><button class="start" id="start">BEGIN</button></div><div class="levelup" id="levelup"><h2>CLAIM A BLESSING</h2><div class="cards" id="cards"></div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);let running=false,gameOver=false,elapsed=0,shake=0;
const player={x:0,y:0,r:11,hp:100,maxhp:100,speed:220,atk:18,atkCd:0,inv:0,dashCd:0,skillCd:0,xp:0,next:100,level:1,angle:0};
let boss,enemies=[],projectiles=[],particles=[],slashes=[];
const names=['THE HOLLOW SUN','THE ASHEN QUEEN','THE GLOTTED ORACLE','THE FIRST TYRANT'];let bossIndex=0;
function reset(){bossIndex=0;player.x=W/2;player.y=H*.64;player.hp=100;player.maxhp=100;player.level=1;player.xp=0;player.next=100;spawnBoss();enemies=[];projectiles=[];particles=[];slashes=[];elapsed=0;gameOver=false}
function spawnBoss(){boss={x:W/2,y:Math.max(180,H*.27),r:40,hp:[240,330,420,520][bossIndex],maxhp:[240,330,420,520][bossIndex],phase:0,cd:1.2,angle:0};$('bossname').textContent=names[bossIndex];$('stage').textContent=['THE SUNKEN TEMPLE','THE THORN PALACE','THE BLIND ALTAR','THE FIRST THRONEROOM'][bossIndex];}
function spawnEnemy(){if(!boss||boss.hp<=0||enemies.length>12)return;let a=Math.random()*6.28,r=150+Math.random()*180;enemies.push({x:boss.x+Math.cos(a)*r,y:boss.y+Math.sin(a)*r,r:8,hp:22+bossIndex*8,cd:Math.random(),type:Math.random()<.25?'seer':'wretch'})}
let joy={x:0,y:0,id:null};const stick=$('stick'),knob=$('knob');function setJoy(e){let r=stick.getBoundingRect();let t=e.touches?.[0];if(!t)return;let cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy;let l=Math.hypot(dx,dy),m=r.width*.34;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('touchstart',e=>{joy.id=e.changedTouches[0].identifier;setJoy(e);e.prevent.preventDefault()},{passive:false});stick.addEventListener('touchmove',e=>{setJoy(e);e.preventDefault()},{passive:false});function endJoy(e){joy.x=joy.y=0;joy.id=null;knob.style.transform=''}stick.addEventListener('touchend',endJoy);stick.addEventListener('touchcancel',endJoy);
function pointerAction(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();fn()})}pointerAction($('atk'),attack);pointerAction($('dash'),dash);pointerAction($('skill'),wrath);
function attack(){if(!running||player.atkCd>0)return;player.atkCd=.32;let a=Math.atan2(boss.y-player.y,boss.x-player.x);if(Math.abs(joy.x)+Math.abs(joy.y)>.2)a=Math.atan2(joy.y,joy.x);player.angle=a;slashes.push({x:player.x+Math.cos(a)*28,y:player.y+Math.sin(a)*28,a,life:.18});for(let target of [boss,...enemies]){let d=Math.hypot(target.x-player.x,target.y-player.y);let ang=Math.atan2(target.y-player.y,target.x-player.x);let diff=Math.abs(Math.atan2(Math.sin(ang-a),Math.cos(ang-a)));if(d<70&&diff<1.15)damage(target,player.atk)}}
function damage(t,n){t.hp-=n;shake=5;for(let i=0;i<6;i++)particles.push({x:t.x,y:t.y,vx:(Math.random-.5)*180,vy:(Math.random-.5)*180,life:.5,color:'#e9cf85'});if(t===boss&&t.hp<=0)killBoss()}
function dash(){if(!running||player.dashCd>0)return;player.dashCd=2.5;player.inv=.55;let l=Math.hypot(joy.x,joy.y)||1,a=Math.atan2(joy.y,joy.x);if(l<.2)a=player.angle;player.x+=Math.cos(a)*90;player.y+=Math.sin(a)*90;for(let i=0;i<12;i++)particles.push({x:player.x,y:player.y,vx:(Math.random-.5)*100,vy:(Math.random-.5)*100,life:.7,color:'#d8cda4'})}
function wrath(){if(!running||player.skillCd>0)return;player.skillCd=8;for(let i=0;i<24;i++){let a=i/24*Math.PI*2;projectiles.push({x:player.x,y:player.y,vx:Math.cos(a)*280,vy:Math.sin(a)*280,r:5,life:1.2,enemy:false,damage:14})}}
function killBoss(){shake=18;player.xp+=100;for(let i=0;i<40;i++)particles.push({x:boss.x,y:boss.y,vx:(Math.random-.5)*260,vy:(Math.random-.5)*260,life:1.2,color:'#dcb75a'});bossIndex++;if(bossIndex>=names.length){victory()}else{setTimeout(spawnBoss,1300);setTimeout(()=>showToast(names[bossIndex],'THE DIVINE WOUND OPENS'),1400)}}
function victory(){running=false;gameOver=true;$('menu').classList.remove('hidden');$('menu').querySelector('.title').innerHTML='ASCENDED';$('menu').querySelector('p').textContent='The last god has fallen. You stand among the eternal.';$('start').textContent='RISE AGAIN'}
function hurt(n){if(player.inv>0)return;player.hp-=n;player.inv=.7;shake=9;if(player.hp<=0){running=false;gameOver=true;$('menu').classList.remove('hidden');$('menu').querySelector('.title').innerHTML='BROKEN';$('menu').querySelector('p').textContent='The gods endure. Gather your wrath and rise once more.';$('start').textContent='TRY AGAIN'}}
function showToast(a,b){let t=$('toast');t.innerHTML=a+'<div class="subtitle">'+b+'</div>';t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}
$('start').onclick=()=>{$('menu').classList.add('hidden');if(gameOver){$('menu').querySelector('.title').innerHTML='GODS<em>SCOURGE</em>'}reset();running=true;showToast(names[0],'A GOD WITHOUT MERCY')};
function chooseBless(){running=false;$('levelup').classList.add('show');let cards=[['SUNFORGED','+8 attack'],['UNDYING','+25 max health'],['TEMPEST','Dashing returns faster']];$('cards').innerHTML=cards.map((c,i)=>`<button class="card" data-i="${i}"><b>${c[0]}</b>${c[1]}</button>`).join('');[...document.querySelectorAll('.card')].forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(i===0)player.atk+=8;if(i===1){player.maxhp+=25;player.hp+=25}if(i===2)player.dashCd=Math.min(player.dashCd,1);$('levelup').classList.remove('show');running=true})}
function update(dt){if(!running)return;elapsed+=dt;player.atkCd-=dt;player.inv-=dt;player.dashCd-=dt;player.skillCd-=dt;if(player.skillCd<0)player.skillCd=0;if(player.dashCd<0)player.dashCd=0;
let l=Math.hypot(joy.x,joy.y);if(l>.12){player.x+=joy.x*player.speed*dt;player.y+=joy.y*player.speed*dt;player.angle=Math.atan2(joy.y,joy.x)}player.x=Math.max(25,Math.min(W-25,player.x));player.y=Math.max(120,Math.min(H-30,player.y));
if(boss){boss.angle+=dt;boss.cd-=dt;if(boss.hp<=0&&bossIndex>0){}else if(boss.cd<=0){boss.cd=Math.max(.55,1.8-bossIndex*.18);let a=Math.atan2(player.y-boss.y,player.x-boss.x);let count=boss.phase?5:3;for(let i=0;i<count;i++){let aa=a+(i-(count-1)/2)*.22;projectiles.push({x:boss.x,y:boss.y,vx:Math.cos(aa)*155,vy:Math.sin(aa)*155,r:6,life:5,enemy:true,damage:10})}boss.phase=!boss.phase} }
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*(28+bossIndex*5)*dt;e.y+=Math.sin(a)*(28+bossIndex*5)*dt;e.cd-=dt;if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r)hurt(7);if(e.hp<=0){enemies.splice(i,1);player.xp+=18;if(player.xp>=player.next){player.xp-=player.next;player.next*=1.25;player.level++;chooseBless()}}}
for(let i=projectiles.length-1;i>=0;i--){let p=projectiles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.enemy){if(Math.hypot(p.x-player.x,p.y-player.y)<p.r+player.r){hurt(p.damage);projectiles.splice(i,1)}}else{let hit=false;if(Math.hypot(p.x-boss.x,p.y-boss.y)<p.r+boss.r){damage(boss,p.damage);hit=true}if(!hit)for(let j=enemies.length-1;j>=0;j--)if(Math.hypot(p.x-enemies[j].x,p.y-enemies[j].y)<p.r+enemies[j].r){damage(enemies[j],p.damage);hit=true;break}if(hit)projectiles.splice(i,1)}if(p.life<=0||p.x<-30||p.x>W+30||p.y<-30||p.y>H+30)projectiles.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=slashes.length-1;i>=0;i--){slashes[i].life-=dt;if(slashes[i].life<=0)slashes.splice(i,1)}
if(Math.random()<dt*(.8+bossIndex*.2))spawnEnemy();$('playerfill').style.width=(player.hp/player.maxhp*100)+'%';if(boss)$('bossfill').style.width=Math.max(0,boss.hp/boss.maxhp*100)+'%';shake*=.86}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>1)ctx.translate((Math.random-.5)*shake,(Math.random-.5)*shake);
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171a27');g.addColorStop(.55,'#171720');g.addColorStop(1,'#090b10');ctx.fillStyle=g;ctx.fillRect(-30,-30,W+60,H+60);
ctx.strokeStyle='rgba(180,164,125,.035)';ctx.lineWidth=1;for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}drawTemple();if(running||gameOver)drawEntities();ctx.restore();requestAnimationFrame(loop)}
function drawTemple(){ctx.save();ctx.translate(W/2,H*.32);ctx.globalAlpha=.22;ctx.fillStyle='#77735f';ctx.beginPath();ctx.arc(0,35,115,Math.PI,0);ctx.fill();ctx.fillRect(-145,35,290,100);ctx.fillStyle='#080a10';for(let i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(i*24,35);ctx.lineTo(i*24+15,135);ctx.lineTo(i*24+28,135);ctx.lineTo(i*24+13,35);ctx.fill()}ctx.restore();}
function drawEntities(){if(boss&&boss.hp>0){ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(Math.sin(boss.angle*.5)*.05);let r=boss.r;let rg=ctx.createRadialGradient(-10,-12,5,0,0,r);rg.addColorStop(0,'#fff3bd');rg.addColorStop(.18,'#b8a76f');rg.addColorStop(.55,'#5b543e');rg.addColorStop(1,'#17191d');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.strokeStyle='rgba(219,191,119,.45)';ctx.lineWidth=3;for(let i=0;i<8;i++){let a=i/8*7+boss.angle*.25;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.75,Math.sin(a)*r*.75);ctx.lineTo(Math.cos(a)*r*1.65,Math.sin(a)*r*1.65);ctx.stroke()}ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-14,-8,5,0,7);ctx.arc(14,-8,5,0,7);ctx.fill();ctx.fillStyle='#f0ca71';ctx.beginPath();ctx.arc(-14,-8,2,0,7);ctx.arc(14,-8,2,0,7);ctx.fill();ctx.restore()}
for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.type==='seer'?'#7d7259':'#433f35';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,7);ctx.lineTo(0,12);ctx.lineTo(-9,7);ctx.closePath();ctx.fill();ctx.restore()}ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);if(player.inv>0&&Math.floor(elapsed*15)%2)ctx.globalAlpha=.35;ctx.fillStyle='#d5c9a9';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.fillStyle='#333540';ctx.beginPath();ctx.moveTo(-7,-9);ctx.lineTo(11,0);ctx.lineTo(-7,9);ctx.closePath();ctx.fill();ctx.strokeStyle='#f1dfad';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(5,-18);ctx.lineTo(5,18);ctx.stroke();ctx.restore();for(let s of slashes){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle=`rgba(245,224,165,${s.life/.18})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,35,-.9,.9);ctx.stroke();ctx.restore()}for(let p of projectiles){ctx.fillStyle=p.enemy?'#e35b48':'#f2dda0';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.fillStyle=p.enemy?'rgba(227,91,72,.18)':'rgba(242,221,160,.18)';ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.2,0,7);ctx.fill()}for(let p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1}
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw()}requestAnimationFrame(loop);
</script></body></html>
