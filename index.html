<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THRONE OF ASH</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090807;font-family:Georgia,'Times New Roman',serif;color:#f4ead2}canvas{display:block;width:100%;height:100%}

#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(22,20,16,.25),rgba(5,5,5,.92));pointer-events:auto}.title{text-align:center}.title h1{margin:0;font-size:clamp(42px,8vw,92px);letter-spacing:12px;font-weight:normal;text-shadow:0 5px 25px #000;color:#d6c39a}.title p{letter-spacing:7px;color:#9e8b61;font-size:12px}.title button{margin-top:35px;border:1px solid #9b824d;background:rgba(20,17,12,.75);color:#dcca9c;padding:15px 38px;font:12px Georgia;letter-spacing:5px;cursor:pointer}.title button:hover{background:#2c2518}.hide{display:none!important}

@media(pointer:coarse),(max-width:800px){#touch{display:block}.top{width:55vw}.top .bossname{font-size:11px}#player{transform:scale(.75);transform-origin:bottom left}#wave{display:none}#cross{display:none}}
</style></head><body>
<div id="menu"><div class="title"><p>THE SUNLESS KEEP</p><h1>THRONE OF ASH</h1><p>THE LAST GOD WAITS BELOW</p><button id="start">ENTER THE KEEP</button></div></div>
<div id="ui"><div class="hud top"><div class="bossname">THE ASHEN GOD</div><div class="bar"><div class="fill" id="bossHp"></div></div><div class="phase" id="phase">FORM I · THE EXILED KING</div></div><div class="hud" id="player"><div class="portrait"></div><div class="ammo" id="ammo">RUNIC EDGE · 3/3</div><div class="hptext">THE PENITENT</div><div class="hpbar"><i id="hp"></i></div><div class="stamina"><i id="stamina"></i></div></div><div class="hud" id="wave"><div>DEPTH</div><div class="level">VII</div></div><div class="hud" id="prompt"></div><div class="hud" id="cross"></div><div id="damage"></div></div>
<div id="touch"><div id="stick"><b id="stickKnob"></b></div><div id="attackTouch"></div><div id="dashTouch"></div><div id="skillTouch"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const $=s=>document.querySelector(s), scene=new THREE.Scene();scene.background=new THREE.Color(0x080907);scene.fog=new THREE.FogExp2(0x080907,.032);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.72;document.body.prepend(renderer.domElement);
const amb=new THREE.HemisphereLight(0x788179,0x160b06,.75);scene.add(amb);const moon=new THREE.DirectionalLight(0xbad0c3,1.1);moon.position.set(-8,15,10);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);
// environment
const stone=new THREE.MeshStandardMaterial({color:0x24241f,roughness:.95});const dark=new THREE.MeshStandardMaterial({color:0x151714,roughness:1});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80,20,20),stone);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
for(let i=0;i<40;i++){const s=.6+Math.random()*2;const p=new THREE.Mesh(new THREE.BoxGeometry(s,.08,s),dark);p.position.set((Math.random()-.5)*55,.02,(Math.random()-.5)*55);p.rotation.y=Math.random()*Math.PI;p.receiveShadow=true;scene.add(p)}
for(let x=-26;x<=26;x+=5.2){for(const z of [-20,20]){const c=new THREE.Mesh(new THREE.CylinderGeometry(.8,.95,7,8),stone);c.position.set(x,3.5,z);c.castShadow=true;scene.add(c)}}
for(let z=-30;z<=30;z+=8){for(const x of [-28,28]){const w=new THREE.Mesh(new THREE.BoxGeometry(2,9,5),dark);w.position.set(x,4.5,z);w.castShadow=true;scene.add(w)}}
// ruins and braziers
const fireMat=new THREE.MeshBasicMaterial({color:0xe88332});const fires=[];for(const [x,z] of [[-14,-12],[14,-12],[-19,8],[19,8]]){const bowl=new THREE.Mesh(new THREE.CylinderGeometry(.7,.45,.5,8),dark);bowl.position.set(x,.25,z);scene.add(bowl);const f=new THREE.Mesh(new THREE.ConeGeometry(.35,1.3,7),fireMat);f.position.set(x,1,z);scene.add(f);fires.push(f);const l=new THREE.PointLight(0xf18a3d,3,12);l.position.set(x,2,z);scene.add(l)}
// ash particles
const pc=new Float32Array(300*3);for(let i=0;i<300;i++){pc[i*3]=(Math.random()-0.5)*50;pc[i*3+1]=Math.random()*12;pc[i*3+2]=(Math.random()-0.5)*50}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pc,3));const ps=new THREE.Points(pg,new THREE.PointsMaterial({color:0xc0aa75,size:.035,transparent:true,opacity:.55}));scene.add(ps);
// player
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.1,4,8),new THREE.MeshStandardMaterial({color:0x39433d,roughness:.7,metalness:.15}));body.position.y=1.15;body.castShadow=true;player.add(body);const helm=new THREE.Mesh(new THREE.SphereGeometry(.45,12,8),new THREE.MeshStandardMaterial({color:0x171b19,roughness:.4,metalness:.7}));helm.position.y=2.15;helm.scale.z=.85;helm.castShadow=true;player.add(helm);const cape=new THREE.Mesh(new THREE.ConeGeometry(.75,1.7,5),new THREE.MeshStandardMaterial({color:0x5a1d16,side:THREE.DoubleSide}));cape.position.set(0,1.15,.55);cape.rotation.x=.15;player.add(cape);const sword=new THREE.Mesh(new THREE.BoxGeometry(.08,1.8,.12),new THREE.MeshStandardMaterial({color:0xc6c1a4,metalness:.85,roughness:.25}));sword.position.set(.55,1.2,-.15);sword.rotation.z=-.35;player.add(sword);scene.add(player);player.position.set(0,0,12);
// boss
const boss=new THREE.Group();const bm=new THREE.MeshStandardMaterial({color:0x29231f,roughness:.45,metalness:.35});const bb=new THREE.Mesh(new THREE.CapsuleGeometry(1.2,2.3,6,10),bm);bb.position.y=2.5;bb.castShadow=true;boss.add(bb);const head=new THREE.Mesh(new THREE.SphereGeometry(.9,12,8),bm);head.position.y=4.3;head.castShadow=true;boss.add(head);for(const x of [-.8,.8]){const horn=new THREE.Mesh(new THREE.ConeGeometry(.25,2.2,7),new THREE.MeshStandardMaterial({color:0x171515,roughness:.5}));horn.position.set(x,5.1,0);horn.rotation.z=x<0?-0.5:.5;horn.castShadow=true;boss.add(horn)}for(const x of [-1.55,1.55]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.45,2.5,5,8),bm);arm.position.set(x,2.5,0);arm.rotation.z=x<0?.35:-.35;arm.castShadow=true;boss.add(arm)}for(const x of [-.65,.65]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.5,1.8,5,8),bm);leg.position.set(x,.9,0);leg.castShadow=true;boss.add(leg)}const glow=new THREE.PointLight(0xff5428,2,8);glow.position.set(0,3,0);boss.add(glow);boss.position.set(0,0,-8);scene.add(boss);
const projectiles=[],effects=[];let hp=3000,bossMax=3000,playerHp=100,stamina=100,running=false,attackCd=0,dashCd=0,skillCd=0,gameOver=false,win=false,phase=1,shake=0,time=0;
const keys={};onkeydown=e=>{keys[e.code]=true;if(e.code==='Space')dash();if(e.code==='KeyF')skill();if(e.code==='KeyE')attack();};onkeyup=e=>keys[e.code]=false;
let dragging=false,stickX=0,stickY=0;const stick=$('#stick'),knob=$('#stickKnob');stick.addEventListener('pointerdown',e=>{dragging=true;stick.setPointerCapture(e.pointerId)});stick.addEventListener('pointermove',e=>{if(!dragging)return;const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=Math.min(d,42);stickX=dx/d*m/42;stickY=dy/d*m/42;knob.style.transform=`translate(${stickX*42}px,${stickY*42}px)`});stick.addEventListener('pointerup',()=>{dragging=false;stickX=stickY=0;knob.style.transform=''});$('#attackTouch').addEventListener('pointerdown',e=>{e.preventDefault();attack()});$('#dashTouch').addEventListener('pointerdown',e=>{e.preventDefault();dash()});$('#skillTouch').addEventListener('pointerdown',e=>{e.preventDefault();skill()});
let yMouse=0,xMouse=0;onmousemove=e=>{if(running){xMouse=(e.clientX/innerWidth-.5)*.8;yMouse=(e.clientY/innerHeight-.5)*.25}};
function attack(){if(!running||gameOver||attackCd>0)return;attackCd=.55;const dir=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));swordSwing();let hit=false;projectiles.length;const d=player.position.distanceTo(boss.position);if(d<3.6){boss.position.addScaledVector(dir,.35);damageBoss(210);hit=true}setTimeout(()=>{if(!hit&&d<5){}},100)}
function swordSwing(){const el=document.createElement('div');el.className='slash';el.style.left=(innerWidth/2-40)+'px';el.style.top=(innerHeight/2-80)+'px';document.body.append(el);el.animate([{opacity:.8,transform:'scale(.5) rotate(-35deg)'},{opacity:0,transform:'scale(1.4) rotate(25deg)'}],{duration:220}).finished.then(()=>el.remove())}
function dash(){if(!running||gameOver||dashCd>0||stamina<25)return;dashCd=.9;stamina-=25;const dir=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));player.position.addScaledVector(dir,3.2);shake=.08}
function skill(){if(!running||gameOver||skillCd>0||stamina<40)return;skillCd=5;stamina-=40;const ring=new THREE.Mesh(new THREE.RingGeometry(.5,1,32),new THREE.MeshBasicMaterial({color:0xffd486,side:THREE.DoubleSide,transparent:true,opacity:.8}));ring.rotation.x=-Math.PI/2;ring.position.copy(player.position);ring.position.y=.08;scene.add(ring);effects.push({m:ring,t:0,type:'ring'});if(player.position.distanceTo(boss.position)<6)damageBoss(420)}
function damageBoss(v){if(gameOver)return;hp-=v;$('#bossHp').style.width=(hp/bossMax*100)+'%';if(hp<=2000&&phase===1){phase=2;$('#phase').textContent='FORM II · GOD OF EMBERS'}if(hp<=800&&phase===2){phase=3;$('#phase').textContent='FORM III · THE ASHEN CROWN'}if(hp<=0){hp=0;win=true;gameOver=true;showEnd(true)}}
function damagePlayer(v){if(gameOver)return;playerHp-=v;playerHp=Math.max(0,playerHp);$('#hp').style.width=playerHp+'%';shake=.15;$('#damage').style.boxShadow='inset 0 0 150px rgba(180,20,10,.75)';setTimeout(()=>$('#damage').style.boxShadow='inset 0 0 150px rgba(180,20,10,0)',150);if(playerHp<=0){gameOver=true;showEnd(false)}}
function showEnd(win){$('#menu').classList.remove('hide');$('#menu').innerHTML=`<div class="title"><p>${win?'THE FALSE GOD HAS FALLEN':'THE KEEP CLAIMS ANOTHER SOUL'}</p><h1>${win?'VICTORY':'OBLIVION'}</h1><button id="again">${win?'DESCEND AGAIN':'RISE AGAIN'}</button></div>`;$('#again').onclick=()=>location.reload()}
$('#start').onclick=()=>{$('#menu').classList.add('hide');running=true};
function fireball(){if(!running||gameOver)return;const mat=new THREE.MeshBasicMaterial({color:0xff5a24});const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.28,1),mat);m.position.copy(boss.position);m.position.y=3;scene.add(m);const dir=player.position.clone().sub(m.position).normalize();projectiles.push({m,dir,speed:phase===3?9:7})}
let bossShot=0,bossMove=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,(performance.now()-time)/1000||.016);time=performance.now();if(running&&!gameOver){attackCd=Math.max(0,attackCd-dt);dashCd=Math.max(0,dashCd-dt);skillCd=Math.max(0,skillCd-dt);stamina=Math.min(100,stamina+18*dt);$('#stamina i').style.width=stamina+'%';bossShot-=dt;if(bossShot<=0){fireball();bossShot=phase===3?.85:phase===2?1.15:1.7}
let mx=(keys.KeyD||0)-(keys.KeyA||0)+stickX,my=(keys.KeyS||0)-(keys.KeyW||0)+stickY;const len=Math.hypot(mx,my);if(len>.1){mx/=Math.max(1,len);my/=Math.max(1,len);const sp=dt*(keys.ShiftLeft?7:5.2);player.position.x+=mx*sp;player.position.z+=my*sp;player.rotation.y=Math.atan2(mx,my);player.position.x=THREE.MathUtils.clamp(player.position.x,-23,23);player.position.z=THREE.MathUtils.clamp(player.position.z,-16,16)}bossMove+=dt;if(bossMove>2.5&&phase>1){bossMove=0;boss.position.x=THREE.MathUtils.clamp(boss.position.x+(Math.random()-.5)*7,-14,14)}
for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.m.position.addScaledVector(p.dir,dt*p.speed);if(p.m.position.distanceTo(player.position.clone().setY(p.m.position.y))<.75){damagePlayer(12);scene.remove(p.m);projectiles.splice(i,1)}else if(p.m.position.length()>40){scene.remove(p.m);projectiles.splice(i,1)}}
for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.t+=dt;e.m.scale.setScalar(1+e.t*5);e.m.material.opacity=Math.max(0,.8-e.t);if(e.t>1){scene.remove(e.m);effects.splice(i,1)}}}
// boss idle
boss.rotation.y=Math.sin(time*.0005)*.05;boss.position.y=Math.sin(time*.0018)*.12;if(running&&!gameOver){camera.position.set(player.position.x,7.5,player.position.z+10);camera.lookAt(boss.position.x,2.2,boss.position.z)}else if(!running){camera.position.set(12,7,18);camera.lookAt(0,2,-4)}
if(running){camera.position.x+=shake*(Math.random()-.5);camera.position.y+=shake*(Math.random()-.5);shake=Math.max(0,shake-dt)}ps.rotation.y=time*.00002;for(const f of fires)f.scale.y=.8+Math.random()*.35;renderer.render(scene,camera)}animate();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
